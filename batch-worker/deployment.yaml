apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-worker
  namespace: rcs-wholesale
  labels:
    app: batch-worker
    component: batch
spec:
  replicas: 1  # 배치는 단일 인스턴스 (ShedLock으로 중복 방지)
  selector:
    matchLabels:
      app: batch-worker
  template:
    metadata:
      labels:
        app: batch-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      serviceAccountName: rcs-wholesale-sa
      containers:
        - name: batch-worker
          image: 615993872885.dkr.ecr.ap-northeast-2.amazonaws.com/rcs-wholesale-batch-worker:9a8665b1daf9d5e82504f13154cc59c446f0cc92
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-redis-secret
                  key: host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_SSL_ENABLED
              value: "true"
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "false"
            - name: DYNAMODB_ENDPOINT
              value: "https://dynamodb.ap-northeast-2.amazonaws.com"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: DEPLOY_ENV
              valueFrom:
                configMapKeyRef:
                  name: rcs-wholesale-config
                  key: deploy.env
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: batch-worker
  namespace: rcs-wholesale
spec:
  selector:
    app: batch-worker
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8083
  type: ClusterIP
