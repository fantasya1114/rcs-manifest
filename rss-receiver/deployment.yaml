apiVersion: apps/v1
kind: Deployment
metadata:
  name: rss-receiver
  namespace: rcs-wholesale
  labels:
    app: rss-receiver
    component: maap-webhook-receiver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rss-receiver
  template:
    metadata:
      labels:
        app: rss-receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      serviceAccountName: rcs-wholesale-sa
      containers:
        - name: rss-receiver
          image: 615993872885.dkr.ecr.ap-northeast-2.amazonaws.com/rcs-wholesale-rss-receiver:2d109135d04bab2430865881a8ff1f0b88317d63
          ports:
            - containerPort: 8085
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcs-wholesale-db-secret
                  key: password
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: rcs-wholesale-config
                  key: kafka.brokers
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_SASL_MECHANISM
              value: "AWS_MSK_IAM"
            - name: KAFKA_SASL_CALLBACK_HANDLER
              value: "software.amazon.msk.auth.iam.IAMClientCallbackHandler"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: DYNAMODB_TABLE_PREFIX
              value: "rcs_"
            - name: DEPLOY_ENV
              valueFrom:
                configMapKeyRef:
                  name: rcs-wholesale-config
                  key: deploy.env
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rss-receiver
  namespace: rcs-wholesale
spec:
  selector:
    app: rss-receiver
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8085
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rss-receiver-hpa
  namespace: rcs-wholesale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rss-receiver
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
